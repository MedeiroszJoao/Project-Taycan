name: Stage4B E66 numerical parser isolated tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e66-segment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated scientific dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3 scipy==1.14.1
      - name: Run E66 segment tests, mandatory no skips
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('tests/unit', pattern='test_e66_generator_fit.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun!=2 or result.skipped or result.errors or result.failures:
              raise SystemExit('E66 dependent tests did not fully run and PASS')
          PY
