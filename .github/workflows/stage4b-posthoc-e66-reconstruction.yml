name: Stage4B posthoc E66 reconstruction (NOT original Work freeze)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned solver/scientific stack
        run: python -m pip install --no-input --disable-pip-version-check 'pybamm==26.4.2' 'numpy==2.1.3' 'scipy==1.14.1'
      - name: Stream original Borealis E66 cell zip, check official MD5, make clearly NEW wrapper and temp spec
        env:
          PYBAMM_DISABLE_TELEMETRY: 'true'
        run: python scripts/run_stage4b_posthoc_e66_reconstruction.py prepare
      - name: RETROSPECTIVE fit using unchanged frozen SOURCE CODE and only originally fitted E66 data
        env:
          PYBAMM_DISABLE_TELEMETRY: 'true'
        run: python scripts/fit_e66_generator_b.py fit --archive results/tmp/stage4b/posthoc_reconstruction/research_wrapper_NOT_original_Work_source.zip
      - name: POSTHOC evaluate same 0.5C/1C previously exposed records; never claim untouched validation
        env:
          PYBAMM_DISABLE_TELEMETRY: 'true'
        run: python scripts/fit_e66_generator_b.py evaluate --archive results/tmp/stage4b/posthoc_reconstruction/research_wrapper_NOT_original_Work_source.zip
      - name: Construct provenance receipt labeling ALL files posthoc, verify fit/freeze/eval hash chain
        env:
          PYBAMM_DISABLE_TELEMETRY: 'true'
        run: python scripts/run_stage4b_posthoc_e66_reconstruction.py final
      - name: Verify reconstructed freeze hashes and original prereg metric gates without changing results
        run: python scripts/audit_e66_frozen_receipts.py --receipts results/e66_calibration --source scripts/fit_e66_generator_b.py --out results/tmp/stage4b/posthoc_reconstruction/RECONSTRUCTED_RECEIPT_AUDIT.json
      - name: Run 2x2 solver/mall factorial on POSTHOC reconstruction only; preserved original Work result
        env:
          PYBAMM_DISABLE_TELEMETRY: 'true'
        run: python scripts/diagnose_e66_1c_frozen_numerics.py --receipts results/e66_calibration --archive results/tmp/stage4b/posthoc_reconstruction/research_wrapper_NOT_original_Work_source.zip --out results/tmp/stage4b/posthoc_reconstruction/POSTHOC_1C_NUMERICAL_FACTORIAL.json
      - name: Preserve only labeled research receipts, exclude 152MB original and wrapper ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-POSTHOC-RECONSTRUCTION-NOT-original-work-freeze
          path: |
            results/tmp/stage4b/posthoc_reconstruction/*.json
            results/e66_calibration/*.json
          if-no-files-found: warn
          retention-days: 30
