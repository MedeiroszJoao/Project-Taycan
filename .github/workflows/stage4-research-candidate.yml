name: Stage 3/4 research candidate tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all original and adversarial unit tests
        env:
          PYTHONPATH: 'src/simulator:src:.'
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Independently inspect effective-capacity energy inventory
        env:
          PYTHONPATH: 'src/simulator:src:.'
        run: python scripts/audit_stage4_energy_inventory.py
      - name: Inspect inverter idle-loss sensitivity without scoring episodes
        env:
          PYTHONPATH: 'src/simulator:src:.'
        run: python scripts/audit_stage4_m01_i01_modes.py
      - name: Generate NEW-SEED development-only 28-feature separability (no classifier)
        env:
          PYTHONPATH: 'src/simulator:src:.'
        run: python scripts/run_stage4_dev_separability.py
      - name: Archive development-only statistics (not Stage 4 results)
        uses: actions/upload-artifact@v4
        with:
          name: stage4-DEVONLY-192cases-66pairs
          path: results/tmp/stage4_devonly/pairwise_feature_separability.json
          if-no-files-found: error
          retention-days: 30
