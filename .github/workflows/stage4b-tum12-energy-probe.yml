name: Stage4B external TUM 12-recording physical-energy diagnostic
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-world-physics-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dimensional equations using synthetic fixtures
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests/unit -p 'test_stage4b_tum_energy_probe.py' -v
      - name: Select twelve fixed TUM sessions and integrate measured electrical / mechanical power
        env:
          PYTHONPATH: .
        run: python scripts/stage4b_tum_energy_probe.py --out results/tmp/stage4b/tum12_energy_real_qc.json
      - name: Archive summaries ONLY - no raw CAN telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4b-tum12-external-energy-report
          path: results/tmp/stage4b/tum12_energy_real_qc.json
          retention-days: 30
          if-no-files-found: warn
