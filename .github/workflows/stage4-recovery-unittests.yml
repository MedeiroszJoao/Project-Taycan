name: Stage 4 recovery and counter tests (no physical simulation)

on:
  push:
    branches:
      - research/stage4-frozen-archive-recovery-2026-10-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify this branch (synthetic fixtures and sealed data only)
        run: |
          python3 --version
          python3 -m unittest discover -s tests/unit -p 'test_stage4_*.py' -v
      - name: Verify recovery tests currently on main, without modifying main
        run: |
          git fetch --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/stage4-main"
          git archive origin/main | tar -xf - -C "$RUNNER_TEMP/stage4-main"
          cd "$RUNNER_TEMP/stage4-main"
          python3 -m unittest discover -s tests/unit -p 'test_recover_stage3_stage4_sources.py' -v
